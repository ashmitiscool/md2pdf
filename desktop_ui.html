<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>md2pdf</title>
  <link rel="stylesheet" href="https://studio.local/vendor/katex.min.css" />
  <style id="docThemeStyles"></style>
  <style>
    :root {
      --bg-shell: #0B0D11;
      --bg-panel: #12161F;
      --bg-elevated: #181E29;
      --border: #232936;
      --border-strong: #323B4D;
      --text-primary: #ECF0F6;
      --text-muted: #8A94A6;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --status-ok: #10B981;
      --status-warn: #F59E0B;
      --font-sans: "Segoe UI", "Inter", "Google Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    @media screen {
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-shell);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
    }

    .studio-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Compact Desktop Quick-Action Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px;
      height: 48px;
      background: var(--bg-shell);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #172554;
      border: 1px solid #1E40AF;
      color: #93C5FD;
      display: grid;
      place-items: center;
      font-family: "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-ok);
      flex-shrink: 0;
    }

    .status-pill.has-warn .status-dot {
      background: var(--status-warn);
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    button, select, input {
      font-family: var(--font-sans);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--bg-panel);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .btn:hover {
      background: var(--bg-elevated);
      border-color: #445066;
    }

    .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* Controls Sub-bar */
    .controlsbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      min-height: 40px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
      overflow-x: auto;
    }

    .control-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .segmented {
      display: inline-flex;
      padding: 2px;
      border-radius: 6px;
      background: var(--bg-shell);
      border: 1px solid var(--border);
    }

    .segmented button {
      height: 24px;
      padding: 0 9px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .segmented button.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .field select {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid var(--border-strong);
      background: var(--bg-shell);
      color: var(--text-primary);
      font-size: 11.5px;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      color: var(--text-primary);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .toggle-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
      margin: 0;
      cursor: pointer;
    }

    /* Workspace Split / Single Views */
    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 44%) 1fr;
      flex: 1;
      min-height: 0;
    }

    .workspace[data-view="preview"] {
      grid-template-columns: 1fr;
    }
    .workspace[data-view="preview"] .editor-pane {
      display: none;
    }

    .workspace[data-view="editor"] {
      grid-template-columns: 1fr;
    }
    .workspace[data-view="editor"] .preview-pane {
      display: none;
    }

    .editor-pane {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      min-height: 0;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--bg-shell);
      min-height: 34px;
    }

    .pane-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .pane-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .file-badge {
      color: var(--text-primary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dirty-dot {
      display: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .dirty-dot.visible {
      display: inline-block;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      height: 22px;
      padding: 0 7px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-ghost:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border);
    }

    /* Markdown Quick Formatting Toolbar */
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 24px;
      padding: 0 7px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-family: var(--font-mono);
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .tool-sep {
      width: 1px;
      height: 15px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* Find & Replace Bar */
    .find-bar {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .find-bar.visible {
      display: flex;
    }

    .find-input {
      height: 25px;
      padding: 0 8px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--bg-shell);
      color: var(--text-primary);
      font-size: 12px;
      width: 155px;
    }

    .find-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 58px;
    }

    #sourceInput {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 14px 16px;
      background: var(--bg-panel);
      color: #DCE3EE;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      outline: none;
      tab-size: 2;
    }

    #sourceInput::placeholder {
      color: #636E82;
    }

    .preview-pane {
      display: flex;
      flex-direction: column;
      background: var(--bg-shell);
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .outline-wrap {
      position: relative;
    }

    .outline-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      min-width: 240px;
      max-width: 340px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 5px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      z-index: 60;
      display: none;
    }

    .outline-menu.visible {
      display: block;
    }

    .outline-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .outline-item:hover {
      background: var(--bg-panel);
      color: #93C5FD;
    }

    .outline-item.lvl-2 { padding-left: 16px; color: #CBD5E1; }
    .outline-item.lvl-3 { padding-left: 24px; color: var(--text-muted); }
    .outline-item.lvl-4 { padding-left: 32px; color: var(--text-muted); font-size: 11px; }

    .outline-empty {
      padding: 8px 10px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .preview-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 44px;
    }

    .paper-sheet {
      max-width: 820px;
      margin: 0 auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 38px 46px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .paper-sheet.theme-dark {
      background: #131314;
      border-color: #27282C;
    }

    .paper-sheet.theme-light {
      background: #FFFFFF;
      border-color: #D4D4D8;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    /* Drag-and-Drop Overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 13, 17, 0.88);
      border: 2px dashed var(--accent);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .drop-overlay.visible {
      display: flex;
    }

    .drop-overlay-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .drop-overlay-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Toast feedback */
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 9px 13px;
      border-radius: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 120;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .paper-sheet {
        padding: 22px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }

    /* Print Mode (used by Print... and Native WebView2 PrintToPdfAsync) */
    @media print {
      .topbar, .controlsbar, .editor-pane, .pane-header, .editor-toolbar, .find-bar, .drop-overlay, .toast, .outline-menu {
        display: none !important;
      }
      .studio-app, .workspace, .preview-pane, .preview-scroll {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }
      .paper-sheet {
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body>
  <div class="studio-app">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark" aria-hidden="true">&Sigma;</div>
        <span class="brand-title">md2pdf</span>
        <span class="status-pill" id="mathStatus">
          <span class="status-dot"></span>
          <span id="mathStatusText">Ready</span>
        </span>
      </div>

      <div class="actions-group">
        <input type="file" id="fileInput" accept=".txt,.md,.markdown,.text,.tex,text/plain,text/markdown" hidden />
        <button class="btn" id="btnPaste" type="button" title="Paste directly from clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          Paste
        </button>
        <button class="btn" id="btnOpenFile" type="button" title="Open .txt or .md file (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Open
        </button>
        <button class="btn" id="btnSaveSource" type="button" title="Save Markdown source (Ctrl+S)">Save</button>
        <button class="btn" id="btnSample" type="button" title="Load sample document (Ctrl+Shift+L)">Sample</button>
        <button class="btn" id="btnBatchPdf" type="button" title="Batch convert multiple .txt/.md files (Ctrl+B)">Batch PDF</button>
        <button class="btn" id="btnSaveHtml" type="button" title="Export standalone HTML (Ctrl+Shift+H)">Save HTML</button>
        <button class="btn" id="btnPrint" type="button" title="Print document (Ctrl+P)">Print</button>
        <button class="btn btn-primary" id="btnExportPdf" type="button" title="Export vector PDF (Ctrl+E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export PDF
        </button>
      </div>
    </header>

    <div class="controlsbar">
      <div class="control-cluster">
        <div class="segmented" role="group" aria-label="Document theme">
          <button type="button" id="themeDark" class="active">Gemini Dark</button>
          <button type="button" id="themeLight">Academic Light</button>
        </div>

        <label class="field">
          <span>Paper</span>
          <select id="paperSelect">
            <option value="A4" selected>A4</option>
            <option value="Letter">Letter</option>
          </select>
        </label>

        <label class="field">
          <span>Margins</span>
          <select id="marginSelect">
            <option value="compact">Compact</option>
            <option value="normal" selected>Normal</option>
            <option value="academic">Academic</option>
          </select>
        </label>

        <label class="field">
          <span>Type</span>
          <select id="fontSizeSelect">
            <option value="13">13 px</option>
            <option value="14">14 px</option>
            <option value="15" selected>15 px</option>
            <option value="16">16 px</option>
          </select>
        </label>
      </div>

      <div class="control-cluster">
        <label class="toggle-label" title="Indent sub-bullets and numbered steps that Gemini flattens on copy">
          <input type="checkbox" id="optNestLists" checked />
          <span>Nest Gemini sub-lists</span>
        </label>
        <label class="toggle-label" title="Strip zero-width and non-breaking padding characters">
          <input type="checkbox" id="optCleanChars" checked />
          <span>Clean hidden chars</span>
        </label>

        <div class="segmented" role="group" aria-label="View layout">
          <button type="button" id="viewSplit" class="active" title="Split View (Ctrl+1)">Split</button>
          <button type="button" id="viewEditor" title="Editor Only (Ctrl+2)">Editor</button>
          <button type="button" id="viewPreview" title="Preview Only (Ctrl+3)">Preview</button>
        </div>
      </div>
    </div>

    <main class="workspace" id="workspace" data-view="split">
      <section class="editor-pane">
        <div class="pane-header">
          <div class="pane-header-left">
            <span class="dirty-dot" id="dirtyDot" title="Unsaved changes"></span>
            <span class="file-badge" id="fileLabel">Untitled</span>
            <span id="charCount">0 chars</span>
          </div>
          <div class="pane-header-right">
            <button class="btn-ghost" id="btnToggleFind" type="button" title="Find and Replace (Ctrl+F)">Find</button>
            <button class="btn-ghost" id="btnClear" type="button">Clear</button>
          </div>
        </div>

        <div class="editor-toolbar" aria-label="Markdown formatting shortcuts">
          <button class="tool-btn" type="button" data-fmt="heading" title="Heading (## )">H2</button>
          <button class="tool-btn" type="button" data-fmt="bold" title="Bold (**text**)"><b>B</b></button>
          <button class="tool-btn" type="button" data-fmt="italic" title="Italic (*text*)"><i>I</i></button>
          <span class="tool-sep"></span>
          <button class="tool-btn" type="button" data-fmt="inlineMath" title="Inline Math ($...$)">$x$</button>
          <button class="tool-btn" type="button" data-fmt="blockMath" title="Display Math ($$...$$)">$$&Sigma;$$</button>
          <span class="tool-sep"></span>
          <button class="tool-btn" type="button" data-fmt="codeBlock" title="Code Block">```</button>
          <button class="tool-btn" type="button" data-fmt="mermaid" title="Mermaid Flowchart">Flowchart</button>
          <button class="tool-btn" type="button" data-fmt="table" title="Markdown Table">Table</button>
          <button class="tool-btn" type="button" data-fmt="quote" title="Callout / Quote">&gt; Quote</button>
        </div>

        <div class="find-bar" id="findBar">
          <input type="text" class="find-input" id="findInput" placeholder="Find in source..." />
          <input type="text" class="find-input" id="replaceInput" placeholder="Replace with..." />
          <label class="toggle-label" title="Match case">
            <input type="checkbox" id="findCase" />
            <span>Aa</span>
          </label>
          <span class="find-count" id="findCount">0 matches</span>
          <button class="btn-ghost" id="btnFindPrev" type="button">Prev</button>
          <button class="btn-ghost" id="btnFindNext" type="button">Next</button>
          <button class="btn-ghost" id="btnReplaceOne" type="button">Replace</button>
          <button class="btn-ghost" id="btnReplaceAll" type="button">All</button>
          <button class="btn-ghost" id="btnFindClose" type="button" title="Close (Esc)">&#x2715;</button>
        </div>

        <textarea
          id="sourceInput"
          spellcheck="false"
          placeholder="Paste Markdown or copied Gemini text (Ctrl+V), click Open, or drop a .txt / .md file anywhere in this window..."
        ></textarea>
      </section>

      <section class="preview-pane">
        <div class="pane-header">
          <span class="file-badge" id="previewTitle">Rendered output</span>
          <div class="pane-header-right">
            <span id="eqBreakdown">0 block &middot; 0 inline</span>
            <div class="outline-wrap">
              <button class="btn-ghost" id="btnOutline" type="button" title="Document outline">Outline &#9662;</button>
              <div class="outline-menu" id="outlineMenu"></div>
            </div>
          </div>
        </div>
        <div class="preview-scroll" id="previewScroll">
          <div class="paper-sheet theme-dark" id="paperSheet">
            <article class="gemini-doc" id="previewDoc"></article>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-overlay-title">Drop .txt or .md file to render</div>
    <div class="drop-overlay-sub">Accepts Gemini Ditto .txt exports, Markdown, and LaTeX files</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://studio.local/vendor/marked.min.js"></script>

  <script src="https://studio.local/gemini-renderer.js"></script>
  <script>
    (function () {
      const FALLBACK_SAMPLE = `## The Law of Total Probability

**Source:** jbstatistics

---

### 1. Core Intuition & Sample Space Partitioning

Suppose a sample space $S$ is divided into $k$ events $B_1, B_2, \\dots, B_k$. For the Law of Total Probability to hold, these events must form a **partition** of $S$, meaning they satisfy two strict conditions:

* **Mutually Exclusive (Disjoint):** No two events $B_i$ and $B_j$ ($i \\neq j$) can occur simultaneously ($B_i \\cap B_j = \\emptyset$). If they overlapped, portions of another event $A$ would be double-counted.
* **Collectively Exhaustive:** Together, the events cover the entire sample space ($\\bigcup_{i=1}^{k} B_i = S$), guaranteeing that exactly one $B_i$ occurs on every run of an experiment. If they were not exhaustive, portions of event $A$ would be missed.

Any event $A$ within $S$ can be decomposed into the union of its intersections with each partition event:


$$A = (A \\cap B_1) \\cup (A \\cap B_2) \\cup \\dots \\cup (A \\cap B_k)$$

*(Note: Even if $A$ does not overlap with a particular partition—meaning $A \\cap B_i = \\emptyset$—the relationship still holds because the empty set contributes zero probability.)*

Because $B_1, \\dots, B_k$ are mutually exclusive, the intersections $(A \\cap B_1), \\dots, (A \\cap B_k)$ are also mutually exclusive, so the probability of $A$ is simply the sum of their probabilities.

---

### 2. Formal Definitions & Identities

* **Intersection Form:**

$$P(A) = \\sum_{i=1}^{k} P(A \\cap B_i)$$


* **Conditional Probability Form (Standard Form):**
Applying the general multiplication rule, $P(A \\cap B_i) = P(B_i)P(A \\mid B_i)$, gives the most practical version of the law:

$$P(A) = P(B_1)P(A \\mid B_1) + P(B_2)P(A \\mid B_2) + \\dots + P(B_k)P(A \\mid B_k) = \\sum_{i=1}^{k} P(B_i)P(A \\mid B_i)$$

---

### 3. Partition Diagram

\`\`\`mermaid
flowchart LR
    S["Sample Space S"] --> B1["Partition B1"]
    S --> B2["Partition B2"]
    B1 --> I1["A ∩ B1"]
    B2 --> I2["A ∩ B2"]
    I1 --> PA["Total P(A)"]
    I2 --> PA
\`\`\``;

      const hasWebView = Boolean(window.chrome && window.chrome.webview);

      const state = {
        theme: 'dark',
        paper: 'A4',
        margins: 'normal',
        fontSize: 15,
        reconstructLists: true,
        cleanInvisible: true,
        viewMode: 'split',
        lastRenderedHtml: '',
        lastTitle: 'md2pdf_Document',
        currentFilename: 'Untitled',
        currentFilepath: '',
        dirty: false,
        savedSnapshot: '',
        lastStats: {
          equations: 0,
          blockEquations: 0,
          inlineEquations: 0,
          diagrams: 0,
          errors: 0
        }
      };

      const elSource = document.getElementById('sourceInput');
      const elPreviewDoc = document.getElementById('previewDoc');
      const elPaperSheet = document.getElementById('paperSheet');
      const elDocThemeStyles = document.getElementById('docThemeStyles');
      const elFileInput = document.getElementById('fileInput');
      const elFileLabel = document.getElementById('fileLabel');
      const elDirtyDot = document.getElementById('dirtyDot');
      const elCharCount = document.getElementById('charCount');
      const elPreviewTitle = document.getElementById('previewTitle');
      const elEqBreakdown = document.getElementById('eqBreakdown');
      const elMathStatus = document.getElementById('mathStatus');
      const elMathStatusText = document.getElementById('mathStatusText');
      const elWorkspace = document.getElementById('workspace');
      const elDropOverlay = document.getElementById('dropOverlay');
      const elToast = document.getElementById('toast');
      const elBtnExportPdf = document.getElementById('btnExportPdf');
      const elFindBar = document.getElementById('findBar');
      const elFindInput = document.getElementById('findInput');
      const elReplaceInput = document.getElementById('replaceInput');
      const elFindCase = document.getElementById('findCase');
      const elFindCount = document.getElementById('findCount');
      const elOutlineMenu = document.getElementById('outlineMenu');
      const elBtnOutline = document.getElementById('btnOutline');

      function postToHost(payload) {
        if (!hasWebView) return false;
        window.chrome.webview.postMessage(JSON.stringify(payload));
        return true;
      }

      let toastTimer = null;
      function showToast(msg) {
        elToast.textContent = msg;
        elToast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          elToast.classList.remove('visible');
        }, 2800);
      }

      function countMetrics(raw) {
        const chars = raw.length;
        const lines = raw.length === 0 ? 0 : raw.split(/\r\n|\r|\n/).length;
        const trimmed = raw.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        return { chars: chars, words: words, lines: lines };
      }

      let stateNotifyTimer = null;
      function notifyHostState(immediate) {
        if (!hasWebView) return;
        const send = function () {
          const metrics = countMetrics(elSource.value);
          postToHost({
            type: 'stateChanged',
            dirty: state.dirty,
            filename: state.currentFilename,
            filepath: state.currentFilepath,
            title: state.lastTitle,
            charCount: metrics.chars,
            wordCount: metrics.words,
            lineCount: metrics.lines,
            blockEq: state.lastStats.blockEquations,
            inlineEq: state.lastStats.inlineEquations,
            errors: state.lastStats.errors,
            settings: {
              theme: state.theme,
              paper: state.paper,
              margins: state.margins,
              fontSize: state.fontSize,
              reconstructLists: state.reconstructLists,
              cleanInvisible: state.cleanInvisible,
              viewMode: state.viewMode
            }
          });
        };
        clearTimeout(stateNotifyTimer);
        if (immediate) {
          send();
        } else {
          stateNotifyTimer = setTimeout(send, 120);
        }
      }

      function updateDirtyFlag() {
        state.dirty = elSource.value !== state.savedSnapshot;
        elDirtyDot.classList.toggle('visible', state.dirty);
      }

      function applyDocumentStyles() {
        const css = GeminiRenderer.getDocumentStyles({
          theme: state.theme,
          paper: state.paper,
          margins: state.margins,
          fontSize: state.fontSize
        });
        elDocThemeStyles.textContent = css;
        elPaperSheet.classList.toggle('theme-dark', state.theme === 'dark');
        elPaperSheet.classList.toggle('theme-light', state.theme === 'light');
        document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
        document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
        document.getElementById('paperSelect').value = state.paper;
        document.getElementById('marginSelect').value = state.margins;
        document.getElementById('fontSizeSelect').value = String(state.fontSize);

        notifyHostState(false);
      }

      function setViewMode(mode) {
        const valid = mode === 'editor' || mode === 'preview' ? mode : 'split';
        state.viewMode = valid;
        elWorkspace.setAttribute('data-view', valid);
        document.getElementById('viewSplit').classList.toggle('active', valid === 'split');
        document.getElementById('viewEditor').classList.toggle('active', valid === 'editor');
        document.getElementById('viewPreview').classList.toggle('active', valid === 'preview');
        notifyHostState(false);
      }

      function rebuildOutline() {
        const headings = elPreviewDoc.querySelectorAll('h1, h2, h3, h4');
        elOutlineMenu.innerHTML = '';
        if (!headings.length) {
          const empty = document.createElement('div');
          empty.className = 'outline-empty';
          empty.textContent = 'No headings in document';
          elOutlineMenu.appendChild(empty);
          return;
        }
        headings.forEach(function (h, idx) {
          const id = 'doc-heading-' + idx;
          h.id = id;
          const level = Number(h.tagName.slice(1));
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'outline-item lvl-' + level;
          btn.textContent = h.textContent.trim() || ('Heading ' + (idx + 1));
          btn.addEventListener('click', function () {
            elOutlineMenu.classList.remove('visible');
            if (state.viewMode === 'editor') {
              setViewMode('split');
            }
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          elOutlineMenu.appendChild(btn);
        });
      }

      function renderNow() {
        const raw = elSource.value;
        elCharCount.textContent = raw.length.toLocaleString() + ' chars';
        updateDirtyFlag();

        if (!raw.trim()) {
          elPreviewDoc.innerHTML = '<p style="opacity:0.6">Paste Markdown or copied Gemini text, or open/drop a .txt or .md file to preview formatted equations.</p>';
          state.lastRenderedHtml = '';
          state.lastTitle = 'md2pdf_Document';
          state.lastStats = { equations: 0, blockEquations: 0, inlineEquations: 0, diagrams: 0, errors: 0 };
          elPreviewTitle.textContent = 'Rendered output';
          elEqBreakdown.textContent = '0 block · 0 inline';
          elMathStatus.classList.remove('has-warn');
          elMathStatusText.textContent = 'Ready';
          rebuildOutline();
          updateFindMatches();
          notifyHostState(false);
          return;
        }

        const result = GeminiRenderer.renderGeminiMarkdown(raw, {
          reconstructLists: state.reconstructLists,
          cleanInvisible: state.cleanInvisible
        });

        const diagramCount = result.stats.diagrams || 0;
        const diagramSuffix = diagramCount > 0
          ? ' · ' + diagramCount + ' diagram' + (diagramCount === 1 ? '' : 's')
          : '';

        state.lastRenderedHtml = result.html;
        state.lastTitle = result.title;
        state.lastStats = {
          equations: result.stats.equations,
          blockEquations: result.stats.blockEquations,
          inlineEquations: result.stats.inlineEquations,
          diagrams: diagramCount,
          errors: result.stats.errors.length
        };

        elPreviewDoc.innerHTML = result.html;
        elPreviewTitle.textContent = result.title.replace(/_/g, ' ');
        elEqBreakdown.textContent =
          result.stats.blockEquations + ' block · ' + result.stats.inlineEquations + ' inline' + diagramSuffix;

        if (result.stats.errors.length > 0) {
          elMathStatus.classList.add('has-warn');
          elMathStatusText.textContent =
            result.stats.equations + ' equations' + diagramSuffix + ' (' + result.stats.errors.length + ' warning)';
        } else {
          elMathStatus.classList.remove('has-warn');
          elMathStatusText.textContent = result.stats.equations + ' equations' + diagramSuffix + ' · vector ready';
        }

        rebuildOutline();
        updateFindMatches();
        notifyHostState(false);
      }

      function buildExportHtml(forPdf) {
        return GeminiRenderer.buildStandaloneHtml(state.lastRenderedHtml, {
          title: state.lastTitle,
          theme: state.theme,
          paper: state.paper,
          margins: state.margins,
          fontSize: state.fontSize,
          forPdf: Boolean(forPdf),
          katexCssHref: forPdf ? 'vendor/katex.min.css' : 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'
        });
      }

      function decodeUploadedBytes(buffer) {
        const bytes = new Uint8Array(buffer);
        if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
          return new TextDecoder('utf-16le').decode(bytes.subarray(2));
        }
        if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
          return new TextDecoder('utf-16be').decode(bytes.subarray(2));
        }
        if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
          return new TextDecoder('utf-8').decode(bytes.subarray(3));
        }
        return new TextDecoder('utf-8').decode(bytes);
      }

      function loadFileObject(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const text = decodeUploadedBytes(ev.target.result);
          elSource.value = text;
          state.currentFilename = file.name;
          state.currentFilepath = '';
          state.savedSnapshot = text;
          elFileLabel.textContent = file.name;
          renderNow();
          notifyHostState(true);
          showToast('Loaded ' + file.name);
        };
        reader.readAsArrayBuffer(file);
      }

      function insertFormatting(kind) {
        const start = elSource.selectionStart;
        const end = elSource.selectionEnd;
        const val = elSource.value;
        const sel = val.slice(start, end);
        let replacement = '';
        let cursorOffset = 0;

        if (kind === 'heading') {
          replacement = '## ' + (sel || 'Section Heading');
          cursorOffset = replacement.length;
        } else if (kind === 'bold') {
          replacement = '**' + (sel || 'bold text') + '**';
          cursorOffset = sel ? replacement.length : 2;
        } else if (kind === 'italic') {
          replacement = '*' + (sel || 'italic text') + '*';
          cursorOffset = sel ? replacement.length : 1;
        } else if (kind === 'inlineMath') {
          replacement = '$' + (sel || 'x^2 + y^2 = r^2') + '$';
          cursorOffset = sel ? replacement.length : 1;
        } else if (kind === 'blockMath') {
          replacement = '\n$$\n' + (sel || '\\sum_{i=1}^{n} x_i') + '\n$$\n';
          cursorOffset = sel ? replacement.length : 4;
        } else if (kind === 'codeBlock') {
          replacement = '\n```python\n' + (sel || 'print("Hello")') + '\n```\n';
          cursorOffset = replacement.length;
        } else if (kind === 'mermaid') {
          replacement = '\n```mermaid\n' + (sel || 'flowchart LR\n    A["Start"] --> B["End"]') + '\n```\n';
          cursorOffset = replacement.length;
        } else if (kind === 'table') {
          replacement = '\n| Column A | Column B |\n| :--- | :--- |\n| Value 1 | Value 2 |\n';
          cursorOffset = replacement.length;
        } else if (kind === 'quote') {
          replacement = '\n> ' + (sel || 'Key takeaway');
          cursorOffset = replacement.length;
        }

        elSource.focus();
        elSource.setRangeText(replacement, start, end, 'select');
        if (!sel) {
          elSource.selectionStart = start + cursorOffset;
          elSource.selectionEnd = start + cursorOffset;
        }
        renderNow();
      }

      // Find & Replace logic
      let findMatchPositions = [];
      let findCursorIndex = -1;

      function updateFindMatches() {
        const query = elFindInput.value;
        findMatchPositions = [];
        findCursorIndex = -1;
        if (!query) {
          elFindCount.textContent = '0 matches';
          return;
        }
        const hay = elFindCase.checked ? elSource.value : elSource.value.toLowerCase();
        const needle = elFindCase.checked ? query : query.toLowerCase();
        let idx = 0;
        while ((idx = hay.indexOf(needle, idx)) !== -1) {
          findMatchPositions.push(idx);
          idx += Math.max(1, needle.length);
        }
        elFindCount.textContent = findMatchPositions.length + (findMatchPositions.length === 1 ? ' match' : ' matches');
      }

      function jumpToFind(step) {
        updateFindMatches();
        if (!findMatchPositions.length) return;
        const len = elFindInput.value.length;
        const curPos = elSource.selectionStart;
        if (step > 0) {
          let found = findMatchPositions.findIndex(function (p) { return p > curPos; });
          findCursorIndex = found === -1 ? 0 : found;
        } else {
          let found = -1;
          for (let i = findMatchPositions.length - 1; i >= 0; i--) {
            if (findMatchPositions[i] < curPos) {
              found = i;
              break;
            }
          }
          findCursorIndex = found === -1 ? findMatchPositions.length - 1 : found;
        }
        const pos = findMatchPositions[findCursorIndex];
        elSource.focus();
        elSource.setSelectionRange(pos, pos + len);
        elFindCount.textContent = (findCursorIndex + 1) + ' / ' + findMatchPositions.length;
      }

      function replaceCurrent() {
        const query = elFindInput.value;
        if (!query) return;
        const s = elSource.selectionStart;
        const e = elSource.selectionEnd;
        const selected = elSource.value.slice(s, e);
        const matches = elFindCase.checked ? selected === query : selected.toLowerCase() === query.toLowerCase();
        if (matches) {
          elSource.setRangeText(elReplaceInput.value, s, e, 'end');
          renderNow();
        }
        jumpToFind(1);
      }

      function replaceAll() {
        const query = elFindInput.value;
        if (!query) return;
        const flags = elFindCase.checked ? 'g' : 'gi';
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(escaped, flags);
        const count = (elSource.value.match(re) || []).length;
        if (!count) {
          showToast('No matches found');
          return;
        }
        elSource.value = elSource.value.replace(re, elReplaceInput.value);
        renderNow();
        showToast('Replaced ' + count + (count === 1 ? ' occurrence' : ' occurrences'));
      }

      function toggleFindBar(forceOpen) {
        if (state.viewMode === 'preview') {
          setViewMode('split');
        }
        const show = typeof forceOpen === 'boolean' ? forceOpen : !elFindBar.classList.contains('visible');
        elFindBar.classList.toggle('visible', show);
        if (show) {
          const sel = elSource.value.slice(elSource.selectionStart, elSource.selectionEnd);
          if (sel && !sel.includes('\n')) {
            elFindInput.value = sel;
          }
          updateFindMatches();
          elFindInput.focus();
          elFindInput.select();
        } else {
          elSource.focus();
        }
      }

      // Action triggers (used both by UI buttons and C# MenuStrip)
      function requestOpenFile() {
        if (hasWebView) {
          postToHost({ type: 'openFile' });
        } else {
          elFileInput.click();
        }
      }

      function requestSaveSource(saveAs) {
        const suggested = state.currentFilename && state.currentFilename !== 'Untitled'
          ? state.currentFilename
          : state.lastTitle + '.md';
        if (hasWebView) {
          postToHost({
            type: 'saveSource',
            content: elSource.value,
            saveAs: Boolean(saveAs),
            suggestedName: suggested
          });
        } else {
          const blob = new Blob([elSource.value], { type: 'text/markdown;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = suggested;
          a.click();
          URL.revokeObjectURL(url);
          state.savedSnapshot = elSource.value;
          updateDirtyFlag();
        }
      }

      function requestSaveHtml() {
        if (!state.lastRenderedHtml) {
          showToast('Nothing to export yet');
          return;
        }
        const html = buildExportHtml(false);
        const suggested = state.lastTitle + '.html';
        if (hasWebView) {
          postToHost({
            type: 'saveHtml',
            html: html,
            suggestedName: suggested
          });
        } else {
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = suggested;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Saved ' + suggested);
        }
      }

      function requestExportPdf() {
        if (!state.lastRenderedHtml) {
          showToast('Nothing to export yet');
          return;
        }
        const standaloneHtml = buildExportHtml(true);
        const suggested = state.lastTitle + '.pdf';
        if (hasWebView) {
          postToHost({
            type: 'exportPdf',
            standaloneHtml: standaloneHtml,
            suggestedName: suggested,
            settings: {
              theme: state.theme,
              paper: state.paper,
              margins: state.margins,
              fontSize: state.fontSize
            }
          });
        } else {
          window.print();
        }
      }

      function requestBatchExport() {
        if (hasWebView) {
          postToHost({
            type: 'batchExport',
            settings: {
              theme: state.theme,
              paper: state.paper,
              margins: state.margins,
              fontSize: state.fontSize
            }
          });
        } else {
          showToast('Batch export requires the Windows Desktop host');
        }
      }

      function requestLoadSample() {
        if (hasWebView) {
          postToHost({ type: 'loadSample' });
        } else {
          window.DesktopHostApp.loadDocument({
            filename: 'sample_preview.txt',
            filepath: '',
            content: FALLBACK_SAMPLE,
            markClean: true
          });
        }
      }

      async function pasteFromClipboard() {
        try {
          const text = await navigator.clipboard.readText();
          if (!text) {
            showToast('Clipboard is empty');
            return;
          }
          elSource.value = text;
          state.currentFilename = 'Clipboard paste';
          state.currentFilepath = '';
          elFileLabel.textContent = 'Clipboard paste';
          renderNow();
          notifyHostState(true);
          showToast('Pasted from clipboard');
        } catch (err) {
          elSource.focus();
          showToast('Clipboard access blocked; click editor and press Ctrl+V');
        }
      }

      // Wire UI Events
      document.getElementById('themeDark').addEventListener('click', function () {
        state.theme = 'dark';
        applyDocumentStyles();
      });
      document.getElementById('themeLight').addEventListener('click', function () {
        state.theme = 'light';
        applyDocumentStyles();
      });
      document.getElementById('paperSelect').addEventListener('change', function (e) {
        state.paper = e.target.value;
        applyDocumentStyles();
      });
      document.getElementById('marginSelect').addEventListener('change', function (e) {
        state.margins = e.target.value;
        applyDocumentStyles();
      });
      document.getElementById('fontSizeSelect').addEventListener('change', function (e) {
        state.fontSize = Number(e.target.value);
        applyDocumentStyles();
      });
      document.getElementById('optNestLists').addEventListener('change', function (e) {
        state.reconstructLists = e.target.checked;
        renderNow();
      });
      document.getElementById('optCleanChars').addEventListener('change', function (e) {
        state.cleanInvisible = e.target.checked;
        renderNow();
      });

      document.getElementById('viewSplit').addEventListener('click', function () { setViewMode('split'); });
      document.getElementById('viewEditor').addEventListener('click', function () { setViewMode('editor'); });
      document.getElementById('viewPreview').addEventListener('click', function () { setViewMode('preview'); });

      elSource.addEventListener('input', renderNow);

      document.querySelectorAll('.tool-btn[data-fmt]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          insertFormatting(btn.getAttribute('data-fmt'));
        });
      });

      document.getElementById('btnToggleFind').addEventListener('click', function () { toggleFindBar(); });
      document.getElementById('btnFindClose').addEventListener('click', function () { toggleFindBar(false); });
      document.getElementById('btnFindNext').addEventListener('click', function () { jumpToFind(1); });
      document.getElementById('btnFindPrev').addEventListener('click', function () { jumpToFind(-1); });
      document.getElementById('btnReplaceOne').addEventListener('click', replaceCurrent);
      document.getElementById('btnReplaceAll').addEventListener('click', replaceAll);
      elFindInput.addEventListener('input', updateFindMatches);
      elFindCase.addEventListener('change', updateFindMatches);
      elFindInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          jumpToFind(e.shiftKey ? -1 : 1);
        } else if (e.key === 'Escape') {
          toggleFindBar(false);
        }
      });

      elBtnOutline.addEventListener('click', function (e) {
        e.stopPropagation();
        elOutlineMenu.classList.toggle('visible');
      });
      document.addEventListener('click', function (e) {
        if (!elOutlineMenu.contains(e.target) && e.target !== elBtnOutline) {
          elOutlineMenu.classList.remove('visible');
        }
      });

      document.getElementById('btnClear').addEventListener('click', function () {
        elSource.value = '';
        state.currentFilename = 'Untitled';
        state.currentFilepath = '';
        elFileLabel.textContent = 'Untitled';
        renderNow();
        notifyHostState(true);
        elSource.focus();
      });

      document.getElementById('btnOpenFile').addEventListener('click', requestOpenFile);
      elFileInput.addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) {
          loadFileObject(e.target.files[0]);
          e.target.value = '';
        }
      });

      document.getElementById('btnSaveSource').addEventListener('click', function () { requestSaveSource(false); });
      document.getElementById('btnSample').addEventListener('click', requestLoadSample);
      document.getElementById('btnPaste').addEventListener('click', pasteFromClipboard);
      document.getElementById('btnBatchPdf').addEventListener('click', requestBatchExport);
      document.getElementById('btnSaveHtml').addEventListener('click', requestSaveHtml);
      document.getElementById('btnExportPdf').addEventListener('click', requestExportPdf);
      document.getElementById('btnPrint').addEventListener('click', function () {
        GeminiRenderer.fitWideEquations(elPreviewDoc, state);
        if (hasWebView) {
          postToHost({ type: 'print' });
        } else {
          window.print();
        }
      });

      // Global paste when focus is outside textarea / find inputs
      document.addEventListener('paste', function (e) {
        const ae = document.activeElement;
        if (ae === elSource || ae === elFindInput || ae === elReplaceInput) return;
        const pasted = e.clipboardData && e.clipboardData.getData('text/plain');
        if (pasted) {
          e.preventDefault();
          elSource.value = pasted;
          state.currentFilename = 'Clipboard paste';
          state.currentFilepath = '';
          elFileLabel.textContent = 'Clipboard paste';
          renderNow();
          notifyHostState(true);
          showToast('Pasted from clipboard');
        }
      });

      // Keyboard shortcut handling inside page
      document.addEventListener('keydown', function (e) {
        if (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleFindBar(true);
        } else if (e.key === 'Escape') {
          if (elFindBar.classList.contains('visible')) {
            toggleFindBar(false);
          }
          elOutlineMenu.classList.remove('visible');
        }
      });

      // Drag and drop anywhere
      let dragDepth = 0;
      window.addEventListener('dragenter', function (e) {
        e.preventDefault();
        dragDepth++;
        elDropOverlay.classList.add('visible');
      });
      window.addEventListener('dragleave', function (e) {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) elDropOverlay.classList.remove('visible');
      });
      window.addEventListener('dragover', function (e) {
        e.preventDefault();
      });
      window.addEventListener('drop', function (e) {
        e.preventDefault();
        dragDepth = 0;
        elDropOverlay.classList.remove('visible');
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files && files[0]) {
          loadFileObject(files[0]);
        }
      });

      // Only minify wide equations during print, then restore scrollable preview
      window.addEventListener('beforeprint', function () {
        GeminiRenderer.fitWideEquations(elPreviewDoc, state);
      });
      window.addEventListener('afterprint', function () {
        GeminiRenderer.resetEquationSizing(elPreviewDoc);
      });
      const printMql = window.matchMedia && window.matchMedia('print');
      if (printMql) {
        const onPrintChange = function (e) {
          if (e.matches) {
            GeminiRenderer.fitWideEquations(elPreviewDoc, state);
          } else {
            GeminiRenderer.resetEquationSizing(elPreviewDoc);
          }
        };
        if (typeof printMql.addEventListener === 'function') {
          printMql.addEventListener('change', onPrintChange);
        } else if (typeof printMql.addListener === 'function') {
          printMql.addListener(onPrintChange);
        }
      }

      // Public API exposed for C# WinForms Host via ExecuteScriptAsync
      window.DesktopHostApp = {
        loadDocument: function (payload) {
          const p = payload || {};
          const text = typeof p.content === 'string' ? p.content : FALLBACK_SAMPLE;
          elSource.value = text;
          state.currentFilename = p.filename || 'Untitled';
          state.currentFilepath = p.filepath || '';
          elFileLabel.textContent = state.currentFilename;
          if (p.markClean !== false) {
            state.savedSnapshot = text;
          }
          renderNow();
          notifyHostState(true);
          if (p.toast) {
            showToast(p.toast);
          }
        },
        markSaved: function (payload) {
          const p = payload || {};
          if (p.filename) state.currentFilename = p.filename;
          if (typeof p.filepath === 'string') state.currentFilepath = p.filepath;
          elFileLabel.textContent = state.currentFilename;
          state.savedSnapshot = elSource.value;
          updateDirtyFlag();
          notifyHostState(true);
          if (p.toast) showToast(p.toast);
        },
        applySettings: function (settings) {
          const s = settings || {};
          let needRender = false;
          if (s.theme === 'dark' || s.theme === 'light') state.theme = s.theme;
          if (s.paper === 'A4' || s.paper === 'Letter') state.paper = s.paper;
          if (s.margins === 'compact' || s.margins === 'normal' || s.margins === 'academic') state.margins = s.margins;
          if (typeof s.fontSize === 'number' && s.fontSize >= 12 && s.fontSize <= 20) state.fontSize = s.fontSize;
          if (typeof s.reconstructLists === 'boolean' && s.reconstructLists !== state.reconstructLists) {
            state.reconstructLists = s.reconstructLists;
            document.getElementById('optNestLists').checked = s.reconstructLists;
            needRender = true;
          }
          if (typeof s.cleanInvisible === 'boolean' && s.cleanInvisible !== state.cleanInvisible) {
            state.cleanInvisible = s.cleanInvisible;
            document.getElementById('optCleanChars').checked = s.cleanInvisible;
            needRender = true;
          }
          if (s.viewMode) setViewMode(s.viewMode);
          applyDocumentStyles();
          if (needRender) renderNow();
        },
        triggerAction: function (actionName, extra) {
          switch (actionName) {
            case 'newDocument':
              elSource.value = '';
              state.currentFilename = 'Untitled';
              state.currentFilepath = '';
              state.savedSnapshot = '';
              elFileLabel.textContent = 'Untitled';
              renderNow();
              notifyHostState(true);
              elSource.focus();
              break;
            case 'requestSaveSource':
              requestSaveSource(false);
              break;
            case 'requestSaveSourceAs':
              requestSaveSource(true);
              break;
            case 'requestExportPdf':
              requestExportPdf();
              break;
            case 'requestSaveHtml':
              requestSaveHtml();
              break;
            case 'toggleFind':
              toggleFindBar();
              break;
            case 'clearEditor':
              document.getElementById('btnClear').click();
              break;
            case 'pasteText':
              pasteFromClipboard();
              break;
            case 'copyRenderedHtml':
              if (navigator.clipboard && state.lastRenderedHtml) {
                navigator.clipboard.writeText(state.lastRenderedHtml).then(function () {
                  showToast('Copied rendered HTML');
                });
              } else {
                showToast('Nothing rendered to copy');
              }
              break;
            case 'showToast':
              if (extra) showToast(String(extra));
              break;
            case 'setExportBusy':
              elBtnExportPdf.disabled = Boolean(extra);
              elBtnExportPdf.innerHTML = extra
                ? 'Exporting PDF...'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PDF';
              break;
            case 'loadFallbackSample':
              this.loadDocument({
                filename: 'sample_preview.txt',
                filepath: '',
                content: FALLBACK_SAMPLE,
                markClean: true
              });
              break;
          }
        },
        getSelfTestSnapshot: function () {
          return {
            ready: Boolean(window.GeminiRenderer && window.katex && window.marked && window.beautifulMermaid),
            title: state.lastTitle,
            filename: state.currentFilename,
            charCount: elSource.value.length,
            blockEquations: state.lastStats.blockEquations,
            inlineEquations: state.lastStats.inlineEquations,
            diagrams: state.lastStats.diagrams,
            errorCount: state.lastStats.errors,
            renderedHtmlLength: state.lastRenderedHtml.length,
            standaloneHtml: buildExportHtml(true)
          };
        }
      };

      applyDocumentStyles();

      if (hasWebView) {
        postToHost({ type: 'ready' });
      } else {
        window.DesktopHostApp.loadDocument({
          filename: 'sample_preview.txt',
          filepath: '',
          content: FALLBACK_SAMPLE,
          markClean: true
        });
      }
    })();
  </script>
</body>
</html>
